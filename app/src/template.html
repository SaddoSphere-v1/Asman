<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graha Bala</title>
<meta name="description" content="Vedic birth-chart calculator: placements with nakshatras, upagrahas, Shadbala, Ishta and Kashta phala, Deeptadi and Lajjitadi avasthas. Lahiri ayanamsa, true Rahu, Swiss Ephemeris.">
<style>/*__CSS__*/</style>
</head>
<body>
<main>
  <h1>Graha Bala</h1>
  <form class="inputs" id="form" autocomplete="off">
    <label>Name <input type="text" id="name" placeholder=""></label>
    <label>Gender <select id="gender"><option value="">—</option><option>Male</option><option>Female</option><option>Other</option></select></label>
    <label>Birthday <input type="date" id="date" required min="1800-01-01" max="2399-12-31"></label>
    <label>Birthtime <input type="time" id="time" step="1" required></label>
    <label class="place">Birthplace <input type="text" id="place" required placeholder="City" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest"><div class="suggest" id="suggest" role="listbox" hidden></div><span class="placeinfo" id="placeinfo"></span></label>
    <div class="actions">
      <button type="submit" class="primary" id="compute">Compute</button>
      <button type="button" id="download" hidden>Download Word document</button>
      <span class="status" id="status">Loading…</span>
    </div>
  </form>
  <div id="results"></div>
</main>
<script type="module">/*__JS__*/</script>
</body>
